# Software Marketplace - QA environment
#
#   docker compose up -d
#
# No setup file needed: every value has a QA default. To change something,
# copy .env.example to .env and edit it.
#
# Everything runs from pre-built images. No Java, Maven or source code needed.
# The backend image is built and pushed to Docker Hub from the backend repo (see docs/MAINTAINERS.md).
# Credentials in this stack are for QA only. Never reuse them anywhere real.

name: software-marketplace-qa

services:

  # ------------------------------------------------------------------ database
  postgres:
    image: postgres:16-alpine
    container_name: marketplace_postgres
    restart: unless-stopped
    environment:
      # The app reads these two from its own config, so they must stay as they are.
      POSTGRES_DB: marketplace_db
      POSTGRES_USER: marketplace_user
      POSTGRES_PASSWORD: marketplace_pass
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace_user -d marketplace_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --------------------------------------------------------------- backend API
  app:
    image: ${APP_IMAGE:-navindu2001/software-marketplace-backend:qa}
    container_name: marketplace_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${APP_PORT:-8080}:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: marketplace_db

      # QA-only signing key (base64). Anyone can read it, so it must never be used outside QA.
      JWT_SECRET: ${JWT_SECRET:-hfD9xQOkAR7w3SK7t1SqtAHQ5jNv4n6rx2IWhTIzN4502kn8RbWBYiaMhOGwcZyE}

      # File storage (S3). Defaults point at the bundled S3 mock below.
      # The mock accepts any keys; they only have to be non-empty.
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY:-qa-access-key}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY:-qa-secret-key}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-http://s3mock:9090}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-marketplace}

      # Emails are caught by Mailpit: open http://localhost:8025
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_USERNAME: qa
      MAIL_PASSWORD: qa
      MAIL_FROM: no-reply@marketplace.local

      # Virus scanning (needs the "scan" profile, see README)
      VIRUS_SCAN_ENABLED: ${VIRUS_SCAN_ENABLED:-false}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"

      ESCROW_HOLD_DAYS: ${ESCROW_HOLD_DAYS:-14}
      PAYOUT_MINIMUM_AMOUNT: ${PAYOUT_MINIMUM_AMOUNT:-20.00}

      # Quieter logs than the developer defaults
      LOGGING_LEVEL_COM_MARKETPLACE: INFO
      LOGGING_LEVEL_ORG_HIBERNATE_SQL: INFO
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/v3/api-docs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  # --------------------------------------------- one-off: create the QA admin
  # Public registration refuses the ADMIN role, so the admin is inserted directly.
  # Login: qa.admin@example.com / Passw0rd!QA   (the "$$" below is how compose writes a literal "$")
  seed-admin:
    image: postgres:16-alpine
    depends_on:
      app:
        condition: service_healthy   # the app has run the migrations by then
    environment:
      PGPASSWORD: marketplace_pass
    command:
      - psql
      - -h
      - postgres
      - -U
      - marketplace_user
      - -d
      - marketplace_db
      - -v
      - ON_ERROR_STOP=1
      - -c
      - "INSERT INTO users (email, password_hash, full_name, role, status) VALUES ('qa.admin@example.com', '$$2b$$10$$XP3SsVYuRYe/L0WxKh6YF./d8Ud23u63YSmU3fpL2Oh2lIGPASsKe', 'QA Admin', 'ADMIN', 'ACTIVE') ON CONFLICT (email) DO NOTHING;"
    restart: "no"

  # ------------------------------------------------------ catches all emails
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${MAILPIT_UI_PORT:-8025}:8025"

  # ------------------------------------------- file storage (S3 mock)
  # MinIO is no longer available on Docker Hub, so QA uses Adobe's S3Mock.
  # It creates the bucket by itself at start-up. It is a mock: it keeps files only while it
  # runs and does not check signatures (see README, "Checking a file download by hand").
  s3mock:
    image: adobe/s3mock:latest
    restart: unless-stopped
    environment:
      initialBuckets: ${AWS_S3_BUCKET:-marketplace}
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${AWS_S3_BUCKET:-marketplace}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:9090:9090"

  # ------------------------------------ profile "scan": ClamAV virus scanner
  clamav:
    image: clamav/clamav:stable
    profiles: ["scan"]
    restart: unless-stopped
    environment:
      CLAMD_CONF_StreamMaxLength: 100M
      CLAMD_CONF_MaxFileSize: 100M
      CLAMD_CONF_MaxScanSize: 100M
      CLAMD_CONF_AlertExceedsMax: "yes"
    volumes:
      - clamav_data:/var/lib/clamav

volumes:
  pg_data:
  clamav_data:
